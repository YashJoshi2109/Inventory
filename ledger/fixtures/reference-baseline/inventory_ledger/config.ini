[app]
; Unique per machine! Second laptop -> INV02, etc. Ledger files are named by this.
device_id = INV01
port = 5001
bind = 127.0.0.1
; Path to the shared sync folder (Google Drive for Desktop / OneDrive local path).
; Example: G:\My Drive\RAID_Ledger_Sync
; Leave blank to work purely locally.
sync_folder =
; sha256 of the admin PIN. Default PIN is 2026 - CHANGE IT:
;   runtime\python.exe -c "import hashlib;print(hashlib.sha256(b'yourpin').hexdigest())"
admin_pin_sha256 = 158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab
; Scanning a location label arms placement for this many seconds.
location_arm_seconds = 60
; Opposing events on the same item across devices within this window -> conflict queue.
conflict_ambiguity_seconds = 10

[locations]
; location scan codes = human name. Print these as barcode labels for shelves.
LOC-SHELF-A = Shelf A (Battery Storage)
LOC-SHELF-B = Shelf B (Workbench)
LOC-SHELF-C = Shelf C (Storage East)
LOC-SHELF-D = Shelf D (Entrance/Testing)
